apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: auth-redis-monitor
  namespace: authentication
  labels:
    app.kubernetes.io/name: redis
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-k8s-infrastructure
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: trading-platform
    app.kubernetes.io/component: monitoring
data:
  k8s_infrastructure.json: |
    {"title": "Trading Discipline AI \u2014 Kubernetes Infrastructure", "uid": "trading-k8s-infrastructure", "tags": ["trading-platform", "kubernetes"], "timezone": "browser", "schemaVersion": 39, "refresh": "10s", "templating": {"list": [{"name": "namespace", "label": "Namespace", "type": "query", "datasource": {"type": "prometheus", "uid": "prometheus"}, "query": "label_values(kube_pod_info, namespace)", "refresh": 1, "includeAll": true, "multi": true, "current": {"text": "All", "value": "$__all"}}, {"name": "pod", "label": "Pod", "type": "query", "datasource": {"type": "prometheus", "uid": "prometheus"}, "query": "label_values(kube_pod_info{namespace=~\"$namespace\"}, pod)", "refresh": 1, "includeAll": true, "multi": true, "current": {"text": "All", "value": "$__all"}}]}, "panels": [{"id": 1, "title": "Node CPU Utilization", "type": "timeseries", "gridPos": {"h": 7, "w": 12, "x": 0, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"unit": "percent"}}, "targets": [{"expr": "100 - (avg by (node) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)", "legendFormat": "{{node}}"}]}, {"id": 2, "title": "Node Memory Utilization", "type": "timeseries", "gridPos": {"h": 7, "w": 12, "x": 12, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"unit": "percent"}}, "targets": [{"expr": "((node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes) * 100", "legendFormat": "Memory %"}]}, {"id": 3, "title": "Pod CPU Usage", "type": "timeseries", "gridPos": {"h": 7, "w": 12, "x": 0, "y": 7}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"unit": "short"}}, "targets": [{"expr": "sum(rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\", pod=~\"$pod\", container!=\"\"}[5m])) by (pod)", "legendFormat": "{{pod}}"}]}, {"id": 4, "title": "Pod Memory Usage (Working Set)", "type": "timeseries", "gridPos": {"h": 7, "w": 12, "x": 12, "y": 7}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"unit": "bytes"}}, "targets": [{"expr": "sum(container_memory_working_set_bytes{namespace=~\"$namespace\", pod=~\"$pod\", container!=\"\"}) by (pod)", "legendFormat": "{{pod}}"}]}, {"id": 5, "title": "Pod Restarts (1h)", "type": "timeseries", "gridPos": {"h": 7, "w": 8, "x": 0, "y": 14}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"unit": "short"}}, "targets": [{"expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=~\"$namespace\", pod=~\"$pod\"}[1h])) by (pod)", "legendFormat": "{{pod}}"}]}, {"id": 6, "title": "Deployment Desired Replicas", "type": "stat", "gridPos": {"h": 7, "w": 8, "x": 8, "y": 14}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"unit": "short"}}, "targets": [{"expr": "sum(kube_deployment_spec_replicas{namespace=~\"$namespace\"}) by (deployment)", "legendFormat": "{{deployment}}"}]}, {"id": 7, "title": "Deployment Available Replicas", "type": "stat", "gridPos": {"h": 7, "w": 8, "x": 16, "y": 14}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"unit": "short"}}, "targets": [{"expr": "sum(kube_deployment_status_replicas_available{namespace=~\"$namespace\"}) by (deployment)", "legendFormat": "{{deployment}}"}]}, {"id": 8, "title": "Deployment Unavailable Replicas", "type": "stat", "gridPos": {"h": 7, "w": 12, "x": 0, "y": 21}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"unit": "short"}}, "targets": [{"expr": "sum(kube_deployment_status_replicas_unavailable{namespace=~\"$namespace\"}) by (deployment) or vector(0)", "legendFormat": "{{deployment}}"}]}, {"id": 9, "title": "Container CPU Throttling Rate", "type": "timeseries", "gridPos": {"h": 7, "w": 12, "x": 12, "y": 21}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"unit": "cps"}}, "targets": [{"expr": "sum(rate(container_cpu_cfs_throttled_periods_total{namespace=~\"$namespace\", pod=~\"$pod\"}[5m])) by (pod) or vector(0)", "legendFormat": "{{pod}}"}]}]}

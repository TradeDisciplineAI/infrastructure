apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-app-services
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: trading-platform
    app.kubernetes.io/component: monitoring
data:
  app_services.json: |
    {"title": "Trading Discipline AI \u2014 Application Services", "uid": "trading-app-services", "tags": ["trading-platform", "application"], "timezone": "browser", "schemaVersion": 39, "refresh": "10s", "templating": {"list": [{"name": "namespace", "label": "Namespace", "type": "query", "datasource": {"type": "prometheus", "uid": "prometheus"}, "query": "label_values(http_requests_total, namespace)", "refresh": 1, "includeAll": true, "multi": true, "current": {"text": "All", "value": "$__all"}}, {"name": "service", "label": "Service", "type": "query", "datasource": {"type": "prometheus", "uid": "prometheus"}, "query": "label_values(http_requests_total{namespace=~\"$namespace\"}, job)", "refresh": 1, "includeAll": true, "multi": true, "current": {"text": "All", "value": "$__all"}}]}, "panels": [{"id": 1, "title": "HTTP Requests / sec", "type": "timeseries", "gridPos": {"h": 7, "w": 12, "x": 0, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"unit": "reqps"}}, "targets": [{"expr": "sum(rate(http_requests_total{namespace=~\"$namespace\", job=~\"$service\"}[5m])) by (job, handler)", "legendFormat": "{{job}} - {{handler}}"}]}, {"id": 2, "title": "HTTP Request Latency (p50, p95, p99)", "type": "timeseries", "gridPos": {"h": 7, "w": 12, "x": 12, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"unit": "s"}}, "targets": [{"expr": "histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket{namespace=~\"$namespace\", job=~\"$service\"}[5m])) by (le))", "legendFormat": "p50"}, {"expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{namespace=~\"$namespace\", job=~\"$service\"}[5m])) by (le))", "legendFormat": "p95"}, {"expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{namespace=~\"$namespace\", job=~\"$service\"}[5m])) by (le))", "legendFormat": "p99"}]}, {"id": 3, "title": "4xx Client Error Rate %", "type": "timeseries", "gridPos": {"h": 7, "w": 12, "x": 0, "y": 7}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"unit": "percent"}}, "targets": [{"expr": "(sum(rate(http_requests_total{namespace=~\"$namespace\", job=~\"$service\", status=~\"4..\"}[5m])) / sum(rate(http_requests_total{namespace=~\"$namespace\", job=~\"$service\"}[5m]))) * 100 or vector(0)", "legendFormat": "4xx Rate %"}]}, {"id": 4, "title": "5xx Server Error Rate %", "type": "timeseries", "gridPos": {"h": 7, "w": 12, "x": 12, "y": 7}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"unit": "percent"}}, "targets": [{"expr": "(sum(rate(http_requests_total{namespace=~\"$namespace\", job=~\"$service\", status=~\"5..\"}[5m])) / sum(rate(http_requests_total{namespace=~\"$namespace\", job=~\"$service\"}[5m]))) * 100 or vector(0)", "legendFormat": "5xx Rate %"}]}, {"id": 5, "title": "Process CPU Usage", "type": "timeseries", "gridPos": {"h": 7, "w": 12, "x": 0, "y": 14}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"unit": "short"}}, "targets": [{"expr": "sum(rate(process_cpu_seconds_total{namespace=~\"$namespace\", job=~\"$service\"}[5m])) by (pod)", "legendFormat": "{{pod}}"}]}, {"id": 6, "title": "Process Resident Memory (RSS)", "type": "timeseries", "gridPos": {"h": 7, "w": 12, "x": 12, "y": 14}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"unit": "bytes"}}, "targets": [{"expr": "sum(process_resident_memory_bytes{namespace=~\"$namespace\", job=~\"$service\"}) by (pod)", "legendFormat": "{{pod}}"}]}, {"id": 7, "title": "Active / Ready Pod Replicas", "type": "stat", "gridPos": {"h": 6, "w": 12, "x": 0, "y": 21}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"unit": "short"}}, "targets": [{"expr": "sum(kube_pod_status_ready{condition=\"true\", namespace=~\"$namespace\"}) by (namespace, pod)", "legendFormat": "{{namespace}} / {{pod}}"}]}, {"id": 8, "title": "Container Restart Count (1h)", "type": "stat", "gridPos": {"h": 6, "w": 12, "x": 12, "y": 21}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"unit": "short"}}, "targets": [{"expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=~\"$namespace\"}[1h])) by (namespace, pod)", "legendFormat": "{{namespace}} / {{pod}}"}]}]}

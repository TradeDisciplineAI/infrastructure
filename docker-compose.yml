# =============================================================================
# Shared Infrastructure Repository — Production Docker Compose Specification
#
# Services:
#   - db: PostgreSQL 16 Alpine Database Engine
#   - redis: Redis 7 Alpine In-Memory Cache & Message Broker
#
# Network Ports:
#   - PostgreSQL: 5432 Internal / 5433 Host
#   - Redis:      6379 Internal / 6379 Host
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: shared_db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable is required}
      POSTGRES_DB: ${POSTGRES_DB:-trading_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - trading_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-trading_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: shared_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - trading_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

networks:
  trading_network:
    external: true

volumes:
  postgres_data:
    name: shared_postgres_data
    driver: local
  redis_data:
    name: shared_redis_data
    driver: local

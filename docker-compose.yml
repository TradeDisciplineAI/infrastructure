# =============================================================================
# Shared Infrastructure Repository — Production Docker Compose Specification
#
# Services:
#   - redis: Redis 7 Alpine In-Memory Cache & Message Broker
#   - test_db: PostgreSQL 16 Alpine Isolated Database Engine for Pytest
#   - jenkins: Custom Jenkins 2.568.2 LTS Controller with Docker, kubectl & az CLI
#
# Network Ports:
#   - Redis:      6379 Internal / 6379 Host
#   - Test DB:    5432 Internal / 5434 Host
#   - Jenkins:    127.0.0.1:8080 Web UI (Loopback Only)
# =============================================================================

services:
  redis:
    image: redis:7-alpine
    container_name: shared_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - trading_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  test_db:
    image: postgres:16-alpine
    container_name: shared_test_db
    restart: unless-stopped
    ports:
      - "${TEST_POSTGRES_PORT:-5434}:5432"
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${TEST_POSTGRES_DB:-trading_test_db}
    volumes:
      - test_postgres_data:/var/lib/postgresql/data
    networks:
      - trading_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  jenkins:
    profiles:
      - tooling
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    image: trading-jenkins:${JENKINS_IMAGE_TAG:-latest}
    container_name: shared_jenkins
    restart: unless-stopped
    ports:
      - "127.0.0.1:${JENKINS_PORT:-8080}:8080"
    environment:
      CASC_JENKINS_CONFIG: "/var/jenkins_home/casc"
    group_add:
      - "${DOCKER_SOCKET_GID:-0}"
    volumes:
      - jenkins_data:/var/jenkins_home
      - ./jenkins/casc:/var/jenkins_home/casc:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - trading_network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/login"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  trading_network:
    external: true

volumes:
  redis_data:
    name: shared_redis_data
    driver: local
  test_postgres_data:
    name: shared_test_postgres_data
    driver: local
  jenkins_data:
    name: shared_jenkins_data
    driver: local
